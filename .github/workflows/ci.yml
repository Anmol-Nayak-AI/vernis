name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/vernis
      VERNIS_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/vernis
      VERNIS_POSTGRES_PORT: "54322"
      STORAGE_SIGNING_SECRET: ci-only-signing-secret-at-least-32-characters
      AUTH_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start PostgreSQL and Redis
        run: |
          cp backend/.env.example backend/.env
          docker compose up -d --wait postgres redis

      - name: Install backend
        run: |
          python -m pip install uv==0.12.23
          cd backend
          uv sync --frozen --extra test

      - name: Migrate and verify backend
        run: |
          cd backend
          uv run alembic upgrade head
          uv run ruff check app tests alembic
          uv run pytest

      - name: Audit Python dependencies
        run: |
          cd backend
          uv export --frozen --no-dev --no-hashes -o /tmp/vernis-audit-requirements.txt >/dev/null
          uvx --python 3.12 pip-audit -r /tmp/vernis-audit-requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

      - name: Install and verify frontend
        run: |
          cd frontend
          npm ci
          npm audit --omit=dev
          npm test
          npm run build

      - name: Run full onboarding and upload path
        run: |
          cd backend
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/vernis-api.log 2>&1 &
          cd ../frontend
          npm run dev -- --host 127.0.0.1 > /tmp/vernis-web.log 2>&1 &
          npx playwright install --with-deps chromium
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/api/v1/health/ready
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:5173/
          npm run test:e2e

      - name: Show service logs on failure
        if: failure()
        run: |
          tail -200 /tmp/vernis-api.log 2>/dev/null || true
          tail -200 /tmp/vernis-web.log 2>/dev/null || true
          docker compose logs --tail=200 postgres redis
