[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vernis-api"
version = "0.2.0"
description = "Vernis Art Intelligence Operating System API"
requires-python = ">=3.10,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "celery>=5.5,<6",
  "fastapi>=0.128,<0.129",
  "openai>=2.7,<3",
  "pillow>=11.3,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "PyJWT[crypto]>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<0.1",
  "redis>=6.4,<8",
  "sqlalchemy>=2.0.44,<2.1",
  "stripe>=13,<15",
  "uvicorn[standard]>=0.37,<0.40",
]

[project.optional-dependencies]
agents = ["crewai>=1.0,<2"]
legacy = [
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
]
test = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["postgres: requires a migrated PostgreSQL database"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008"]
