name: vernis

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: vernis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${VERNIS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - vernis-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vernis"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.2.2-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${VERNIS_REDIS_PORT:-56379}:6379"
    volumes:
      - vernis-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: vernis-backend
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/vernis
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      STORAGE_ROOT: /app/storage
      STORAGE_SIGNING_SECRET: local-compose-only-change-before-production
      AUTH_REQUIRED: "false"
      CREW_ENABLED: "true"
      EXTERNAL_AI_TEXT_ENABLED: "true"
      OTEL_SDK_DISABLED: "true"
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${VERNIS_API_PORT:-18000}:8000"
    volumes:
      - vernis-assets:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    image: vernis-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/vernis
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      STORAGE_ROOT: /app/storage
      CREW_ENABLED: "true"
      EXTERNAL_AI_TEXT_ENABLED: "true"
      OTEL_SDK_DISABLED: "true"
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    volumes:
      - vernis-assets:/app/storage
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${VERNIS_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  vernis-postgres:
  vernis-redis:
  vernis-assets:
